[project]
name = "policy-alignment-classifier"
version = "0.1.0"
description = "Policy Alignment Classifier"
authors = [
    {name = "Your Name",email = "you@example.com"}
]
requires-python = ">=3.12,<4.0.0"

[tool.poetry]
packages = [{include = "policy_classifier"}]

[tool.poetry.scripts]
pa-serve = "policy_classifier.server:main"

[tool.poetry.dependencies]
pydantic = "^2.13.5"
langchain-google-genai = "^4.4.0"
langchain-mistralai = "^1.1.6"
langchain-groq = "^1.1.3"
python-dotenv = "^1.2.3"
fastapi = "^0.142.2"
uvicorn = "^0.54.0"
langchain-core = "^1.6.6"
pandas = "^3.0.6"
[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"